<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Neo Code IDE — Next-Gen AI Code Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    animation: {
                        'glow-pulse': 'glowPulse 2.5s ease-in-out infinite',
                    },
                    keyframes: {
                        glowPulse: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 8px rgba(59,130,246,0.6))' },
                            '50%': { filter: 'drop-shadow(0 0 22px rgba(59,130,246,0.95))' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030712; color: #f3f4f6; }
        .bg-grid { 
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px); 
            background-size: 28px 28px; 
        }
        .glow-effect { box-shadow: 0 0 120px -30px rgba(37, 99, 235, 0.45); }
        .button-glow { 
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.45); 
            transition: all 0.3s ease;
        }
        .button-glow:hover { 
            box-shadow: 0 0 50px rgba(37, 99, 235, 0.85); 
            transform: translateY(-1px);
        }
        .logo-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.4) 0%, transparent 70%);
            animation: logoAura 3s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes logoAura {
            0%, 100% { opacity: 0.45; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
        input:focus, textarea:focus, button:focus { outline: none; }
        
        /* Mobile header fix */
        @media (max-width: 640px) {
            .logo-img { width: 36px !important; height: 36px !important; }
        }
    </style>
</head>
